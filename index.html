  // src/systems/leveling.ts
  function expToNext(level) {
    return Math.floor(
      LEVEL_RULE.baseExp * Math.pow(LEVEL_RULE.growth, level - 1)
    );
  }
  function equipBonus(c) {
    const total = {};
    for (const itemId of Object.values(c.equipment)) {
      const item = itemId ? ITEMS[itemId] : void 0;
      if (!item?.bonus) continue;
      for (const [key, value] of Object.entries(item.bonus)) {
        const k = key;
        total[k] = (total[k] ?? 0) + (value ?? 0);
      }
    }
    return total;
  }
  function canEquip(c, item) {
    if (!item.equipBy || item.equipBy.length === 0) return true;
    const gender = CHARACTER_TEMPLATES[c.id]?.gender;
    return item.equipBy.some((t) => t === c.id || t === gender);
  }
  function recomputeStats(c) {
    const g = LEVEL_RULE.growthPerLevel;
    const lv = c.level - 1;
    const b = equipBonus(c);
    const prevMaxHp = c.maxHp;
    const prevMaxMp = c.maxMp;
    c.maxHp = c.base.hp + g.hp * lv + (b.hp ?? 0);
    c.maxMp = c.base.mp + g.mp * lv + (b.mp ?? 0);
    c.atk = c.base.atk + g.atk * lv + (b.atk ?? 0);
    c.def = c.base.def + g.def * lv + (b.def ?? 0);
    c.spd = c.base.spd + g.spd * lv + (b.spd ?? 0);
    c.mag = c.base.mag + g.mag * lv + (b.mag ?? 0);
    if (prevMaxHp > 0) c.hp += c.maxHp - prevMaxHp;
    if (prevMaxMp > 0) c.mp += c.maxMp - prevMaxMp;
    c.hp = Math.min(c.hp, c.maxHp);
    c.mp = Math.min(c.mp, c.maxMp);
  }
  function gainExp(c, amount) {
    const logs = [];
    c.exp += amount;
    while (c.level < MAX_LEVEL && c.exp >= expToNext(c.level)) {
      c.exp -= expToNext(c.level);
      c.level += 1;
      recomputeStats(c);
      const learnset = CHARACTER_TEMPLATES[c.id]?.learnset ?? [];
      const learned = learnset.filter((l) => l.level === c.level).map((l) => l.skill);
      for (const s of learned) if (!c.skills.includes(s)) c.skills.push(s);
      logs.push({ level: c.level, skills: learned });
    }
    return logs;
  }

  // src/systems/explore.ts
  var DONE_PREFIX = "ia:";
  var ENTER_PREFIX = "enter:";
  function hasFlags(state2, flags) {
    if (!flags || flags.length === 0) return true;
    return flags.every(
      (f) => f.startsWith("!") ? state2.flags[f.slice(1)] !== true : state2.flags[f] === true
    );
  }
  function isDone(state2, id) {
    return state2.flags[DONE_PREFIX + id] === true;
  }
  function markDone(state2, id) {
    state2.flags[DONE_PREFIX + id] = true;
  }
  function hasEntered(state2, sceneId) {
    return state2.flags[ENTER_PREFIX + sceneId] === true;
  }
  function markEntered(state2, sceneId) {
    state2.flags[ENTER_PREFIX + sceneId] = true;
  }
  function visibleExits(scene2, state2) {
    return scene2.exits.filter(
      (e) => (hasFlags(state2, e.requires) || (e.lockedText?.length ?? 0) > 0) && !(e.hideWhen && hasFlags(state2, e.hideWhen))
    );
  }
  function availableInteractables(scene2, state2) {
    return scene2.interactables.filter(
      (i) => hasFlags(state2, i.requires) && !(i.hideWhen && hasFlags(state2, i.hideWhen)) && (i.repeatable === true || !isDone(state2, i.id))
    );
  }
  function rollExplore(area, rng = Math.random) {
    const roll = rng();
    if (roll < EXPLORE_RULE.battleChance) {
      const group = area.encounters[Math.floor(rng() * area.encounters.length)];
      return { kind: "battle", enemies: group ? [...group] : [] };
    }
    if (roll < EXPLORE_RULE.battleChance + EXPLORE_RULE.chestChance) {
      const items = [];
      for (const l of area.loot ?? []) {
        if (rng() < l.chance) {
          const min = l.min ?? 1;
          const max = l.max ?? 1;
          items.push({
            itemId: l.itemId,
            qty: min + Math.floor(rng() * (max - min + 1))
          });
        }
      }
      const [lo, hi] = area.chestGold ?? [0, 0];
      const gold = lo + Math.floor(rng() * (hi - lo + 1));
      return { kind: "chest", gold, items };
    }
    return { kind: "nothing" };
  }

  // src/systems/inventory.ts
  function addItem(items, itemId, qty) {
    const found = items.find((i) => i.itemId === itemId);
    if (found) found.qty += qty;
    else items.push({ itemId, qty });
  }
  function consumeItem(items, entry) {
    entry.qty -= 1;
    if (entry.qty <= 0) {
      const idx = items.indexOf(entry);
      if (idx >= 0) items.splice(idx, 1);
    }
  }

  // src/systems/shop.ts
  function sellPrice(price) {
    return Math.floor(price * SHOP_RULE.sellRate);
  }
  function buyItem(state2, itemId) {
    const item = ITEMS[itemId];
    if (!item || item.price <= 0 || state2.gold < item.price) return false;
    state2.gold -= item.price;
    addItem(state2.items, itemId, 1);
    return true;
  }
  function sellItem(state2, entry) {
    const item = ITEMS[entry.itemId];
    if (!item || item.price <= 0 || entry.qty <= 0) return false;
    state2.gold += sellPrice(item.price);
    consumeItem(state2.items, entry);
    return true;
  }

  // src/systems/rest.ts
  function restParty(state2, cost) {
    const needRest = state2.party.some((p) => p.hp < p.maxHp || p.mp < p.maxMp);
    if (!needRest) return "full";
    if (cost > 0 && state2.gold < cost) return "poor";
    if (cost > 0) state2.gold -= cost;
    for (const p of state2.party) {
      p.hp = p.maxHp;
      p.mp = p.maxMp;
    }
    return "ok";
  }

  // src/systems/treasure.ts
  function openTreasure(state2, entry) {
    const item = ITEMS[entry.itemId];
    if (!item || item.kind !== "treasure" || entry.qty <= 0) return null;
    const gold = item.contains?.gold ?? 0;
    const items = item.contains?.items ?? [];
    const skills = item.contains?.skills ?? [];
    if (gold > 0) state2.gold += gold;
    for (const it of items) addItem(state2.items, it.itemId, it.qty);
    consumeItem(state2.items, entry);
    return { gold, items, skills };
  }

  // src/systems/objectives.ts
  function currentObjective(state2) {
    const found = OBJECTIVES.find((o) => !hasFlags(state2, o.done));
    return found ? found.text : OBJECTIVE_ALL_DONE;
  }

  // src/systems/combat-core.ts
  var uidSeq = 0;
  function spawnEnemy(templateId) {
    const t = ENEMIES[templateId];
    if (!t) throw new Error(`未知敵人：${templateId}`);
    uidSeq += 1;
    return {
      uid: `${t.id}-${uidSeq}`,
      id: t.id,
      name: t.name,
      level: t.level,
      maxHp: t.hp,
      hp: t.hp,
      maxMp: t.mp,
      mp: t.mp,

  async function battle(enemyIds, boss) {
    battleEnemies = enemyIds.map(spawnEnemy);
    state.party.forEach(function(m) {
      m.status = {};
      m.buffs = [];
    });
    var runaways = battleEnemies.filter(function(e) {
      return enemyFlees(e, state.party);
    });
    if (runaways.length > 0) {
      var stayed = battleEnemies.filter(function(e) {
        return runaways.indexOf(e) < 0;
      });
      var who = state.party.filter(function(p) {
        return runaways.some(function(e) {
          return (e.fleesFrom || []).indexOf(p.id) >= 0;
        });
      })[0];
      logLine(
        "　" + runaways.map(function(e) {
          return e.name;
        }).join("、") + "見了" + (who ? who.name : "熟人") + "，嚇得一哄而散，不敢造次。",
        "info"
      );
      await message("　");
      if (stayed.length === 0) return true;
      battleEnemies = stayed;
    }
    logLine(
      "　" + battleEnemies.map(function(e) {
        return e.name;
      }).join("、") + " 出現在眼前！",
      "battle"
    );
    await message("　");
    var round = 0;
    while (true) {
      round += 1;
      logLine("── 第 " + round + " 回合 ──", "dim");
      battleLine();
      var order = alive(state.party).concat(alive(battleEnemies)).sort(function(a, b) {
        return effectiveStat(b, "spd") - effectiveStat(a, "spd");
      });
      var pending2 = {};
      for (var k = 0; k < order.length; k++) {
        var a0 = order[k];
        var ally0 = state.party.filter(function(p) {
          return p.uid === a0.uid && p.hp > 0;
        })[0];
        if (!ally0) continue;
        if (hasStatus(ally0, "sleep") || hasStatus(ally0, "paralyze") || hasStatus(ally0, "confuse"))
          continue;
        pending2[ally0.uid] = await chooseAction(ally0, boss);
      }
      for (var i = 0; i < order.length; i++) {
        var actor = order[i];
        if (actor.hp <= 0) continue;
        if (hasStatus(actor, "poison")) {
          var dmg = Math.max(1, Math.floor(actor.maxHp * 0.05));
          actor.hp = Math.max(0, actor.hp - dmg);
          await battleLog(
            actor.name + " 毒發，損失 " + dmg + " 點生命。",
            "warn"
          );
          if (actor.hp <= 0) await battleLog(actor.name + " 被擊倒了。", "dim");
        }
        if (actor.hp > 0) {
          var isAlly = state.party.filter(function(p) {
            return p.uid === actor.uid && p.hp > 0;
          }).length > 0;
          if (hasStatus(actor, "sleep") || hasStatus(actor, "paralyze")) {
            await battleLog(
              actor.name + " 處於" + statusLabel(hasStatus(actor, "sleep") ? "sleep" : "paralyze") + "，無法行動。",
              "dim"
            );
          } else if (hasStatus(actor, "confuse")) {
            await confusedTurn(actor);
          } else if (isAlly) {
            var act = pending2[actor.uid];
            if (act) {
              var result = await resolveAction(actor, act);
              if (result === "flee") {
                return false;
              }
            }
          } else {
            await enemyTurn(actor);
          }
        }
        tickTimers(actor);
        renderStatus();
        if (alive(battleEnemies).length === 0) {
          settleVictory(battleEnemies);
          await message("　");
          return true;
        }
        if (alive(state.party).length === 0) {
          logLine("眼前一黑，李逍遙倒了下去……", "warn");
          logLine("再醒來時，已躺回餘杭客棧的床榻之上。", "dim");
          state.party.forEach(function(m) {
            m.hp = m.maxHp;
            m.mp = m.maxMp;
          });
          state.sceneId = D.START_SCENE;
          renderStatus();
          await message("　");
          return false;
        }
      }
      await message("── 第 " + round + " 回合結束 ──　按繼續進入下一回合");
    }
  }

      }).join("、") || "無"),
      null
    );
    var choice = await choose("是否更換裝備？", [
      { label: "更換裝備", value: true },
      { label: "返回", value: false }
    ]);
    if (choice) await doEquip(m);
  }
  async function doEquip(m) {
    while (true) {
      var slot = await choose(
        "選擇部位",
        D.EQUIP_SLOTS.map(function(s) {
          var id = m.equipment[s.id];
          return {
            label: s.name + "：" + (id ? D.ITEMS[id].name + "（" + bonusText(D.ITEMS[id].bonus) + "）" : "無"),
            value: s.id
          };
        }).concat([{ label: "返回", value: null }])
      );
      if (!slot) return;
      await chooseEquip(m, slot);
    }
  }
  async function chooseEquip(m, slot) {
    var slotName = (D.EQUIP_SLOTS.filter(function(s) {
      return s.id === slot;
    })[0] || {}).name || slot;
    var equipped = m.equipment[slot];
    var candidates = state.items.filter(function(e) {
      return e.qty > 0 && D.ITEMS[e.itemId].kind === "equip" && D.ITEMS[e.itemId].slot === slot && canEquip(m, D.ITEMS[e.itemId]);
    });
    if (!equipped && candidates.length === 0) {
      logLine("沒有可裝備於「" + slotName + "」的物品。", "dim");
      await message("　");
      return;
    }
    var options = [];
    if (equipped)
      options.push({
        label: "卸下（目前：" + D.ITEMS[equipped].name + "　" + bonusText(D.ITEMS[equipped].bonus) + "）",
        value: "off"
      });
    candidates.forEach(function(e) {
      options.push({
        label: D.ITEMS[e.itemId].name + "（" + bonusText(D.ITEMS[e.itemId].bonus) + "）×" + e.qty,
        value: e
      });
    });
    options.push({ label: "取消", value: null });
    var choice = await choose(m.name + "｜" + slotName, options);
    if (!choice) return;
    if (equipped) {
      addItem(state.items, equipped, 1);
      delete m.equipment[slot];
    }
    if (choice === "off") {
      logLine(
        "　" + m.name + " 卸下了「" + D.ITEMS[equipped].name + "」。",
        null
      );
    } else {
      consumeItem(state.items, choice);
      m.equipment[slot] = choice.itemId;
      logLine(
        "　" + m.name + " 裝備了「" + D.ITEMS[choice.itemId].name + "」。",
        null
      );
    }
    recomputeStats(m);
    logLine(
      "　攻擊 " + m.atk + "　防禦 " + m.def + "　身法 " + m.spd + "　靈力 " + m.mag,
      null
    );
    await message("　");
  }
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {
    }
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function newGame(sceneId = null) {
    state = {
      party: [createCharacter("li-xiaoyao")],
      gold: 0,
      items: [
        { itemId: "herb", qty: 3 },
        { itemId: "qi-pill", qty: 1 }
      ],
      sceneId: sceneId || D.START_SCENE,
      flags: {}
    };
  }
  async function mainMenu() {
    while (true) {
      renderStatus();
      var choice = await choose("主選單", [
        { label: "探索", value: "explore" },
        { label: "移動（" + scene().name + "）", value: "move" },
        { label: "仙術", value: "magic" },
        { label: "道具", value: "item" },
        { label: "隊伍狀態", value: "status" },
        { label: "存檔", value: "save" },
        { label: "回到標題", value: "title" }
      ]);
      if (choice === "explore") await doExplore();
      else if (choice === "move") await doMove();
      else if (choice === "magic") await doMagic();
      else if (choice === "item") await doItem();
      else if (choice === "status") await doStatus();
      else if (choice === "save") {
        save();
        logLine("　已儲存進度。", "info");
        await message("　");
      } else if (choice === "title") return;
    }
  }
  async function titleScreen() {
    logEl.innerHTML = "";
    var saved = load();
    logLine(D.GAME_TITLE, "sys");
    logLine(D.GAME_SUBTITLE, "dim");
    logLine("　一念御劍，一世情長。", "dim");
    var opts = [{ label: "新遊戲", value: "new" }];
    if (saved) opts.push({ label: "讀取存檔", value: "load" });
    var choice = await choose("　主選單", opts);
    if (choice === "load" && saved) {
      state = saved;
    } else newGame();
    await enterScene(state.sceneId);
    await mainMenu();
  }
  window.addEventListener("DOMContentLoaded", function() {
    logEl = document.getElementById("log");
    actionsEl = document.getElementById("actions");
    barEl = document.getElementById("bar");
    barEl.querySelector(".title").textContent = D.GAME_TITLE + " · 終端文字版";
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        var b = actionsEl.querySelector("button:not([disabled])");
        if (b) b.click();
      }
    });
    titleScreen();
  });
})();
</script>
</body>
</html>
