name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 讓工作流程能發佈到 Pages（id-token 供 OIDC 驗證）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署；新的 push 會取消進行中的舊部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build single-file web
        run: npm run build:web

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html paladin.html 404.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
